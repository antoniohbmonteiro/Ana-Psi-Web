name: Admin CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'tsconfig.base.json'
      - '.github/workflows/admin-ci.yml'
      - '.github/workflows/admin-preview-cleanup.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'tsconfig.base.json'
      - '.github/workflows/admin-ci.yml'
      - '.github/workflows/admin-preview-cleanup.yml'

# Every job declares its own permissions.
permissions: {}

# Concurrency is set per job, not per workflow: a new push cancels superseded checks and image
# builds, but never interrupts a running preview deploy (docs/admin-preview.md, "Concorrência").

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: admin-ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test appointments core
        run: npm run test:appointments --workspace @ana-psi/admin

      - name: Test administrative security
        run: npm run test:security:admin

      - name: Test Firestore mapping and asynchronous reads
        run: npm run test:persistence:admin

      - name: Typecheck admin
        run: npm run typecheck:admin

      - name: Lint admin
        run: npm run lint:admin

      - name: Build admin
        run: npm run build:admin

      - name: Test Auth, Firestore, Rules and protected routes
        run: npm run test:integration:admin

  # Builds the PR code into an image. No cloud credentials exist in this job.
  preview-image:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.ADMIN_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout of the PR code being built
    concurrency:
      group: admin-preview-image-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build admin image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          tags: admin-preview:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/admin-image.tar
          cache-from: type=gha,scope=admin-preview-pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=admin-preview-pr-${{ github.event.pull_request.number }}

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-image-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/admin-image.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  # Publishes the image built above. This job holds the deploy identity, so it never checks out
  # or runs repository code. It shares the admin-preview-pr-N group with the cleanup workflow and
  # re-reads the PR state before and after deploying.
  preview-deploy:
    needs: [check, preview-image]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.ADMIN_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # GitHub OIDC token exchanged through Workload Identity Federation
      pull-requests: write # read the PR state and keep the preview comment up to date
    concurrency:
      group: admin-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROJECT_ID: ${{ vars.ADMIN_PREVIEW_PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.ADMIN_PREVIEW_PROJECT_NUMBER }}
      REGION: ${{ vars.ADMIN_PREVIEW_REGION }}
      RUNTIME_SA: ${{ vars.ADMIN_PREVIEW_RUNTIME_SA }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Validate preview configuration
        env:
          WIF_PROVIDER: ${{ vars.ADMIN_PREVIEW_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.ADMIN_PREVIEW_DEPLOYER_SA }}
          ALLOWED_UID: ${{ secrets.ADMIN_PREVIEW_ALLOWED_UID }}
          FIREBASE_API_KEY: ${{ vars.ADMIN_PREVIEW_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.ADMIN_PREVIEW_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_APP_ID: ${{ vars.ADMIN_PREVIEW_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          for name in PROJECT_ID PROJECT_NUMBER REGION RUNTIME_SA WIF_PROVIDER DEPLOYER_SA \
            ALLOWED_UID FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_APP_ID; do
            [ -n "${!name}" ] || fail "Preview configuration is incomplete: $name is empty."
          done
          # Previews never target the production project.
          [ "$PROJECT_ID" != "ana-psi" ] || fail "Refusing to deploy a preview to the production project."
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || fail "Invalid project ID."
          [[ "$PROJECT_NUMBER" =~ ^[0-9]{6,20}$ ]] || fail "Invalid project number."
          [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || fail "Invalid region."
          [[ "$PR_NUMBER" =~ ^[0-9]{1,6}$ ]] || fail "Invalid pull request number."
          [[ "$RUNTIME_SA" == *"@$PROJECT_ID.iam.gserviceaccount.com" ]] || fail "The runtime service account must belong to the preview project."
          [[ "$DEPLOYER_SA" == *"@$PROJECT_ID.iam.gserviceaccount.com" ]] || fail "The deployer service account must belong to the preview project."
          [[ "$WIF_PROVIDER" == "projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/"* ]] || fail "The WIF provider must belong to the preview project."
          [[ "$FIREBASE_AUTH_DOMAIN" == "$PROJECT_ID."* ]] || fail "The Firebase auth domain must belong to the preview project."
          {
            echo "SERVICE=admin-pr-$PR_NUMBER"
            echo "IMAGE=$REGION-docker.pkg.dev/$PROJECT_ID/admin-preview/pr-$PR_NUMBER"
            echo "PREVIEW_URL=https://admin-pr-$PR_NUMBER-$PROJECT_NUMBER.$REGION.run.app"
          } >> "$GITHUB_ENV"

      - name: Read pull request state
        id: state
        run: |
          set -euo pipefail
          # Fail closed: an API error stops the job instead of being read as "closed".
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
          state=${pr%% *}
          head=${pr#* }
          case "$state" in open|closed) ;; *) echo "::error::Unexpected pull request state."; exit 1;; esac
          if [ "$state" != "open" ]; then
            action=remove
          elif [ "$head" != "$RUN_HEAD_SHA" ]; then
            action=superseded
          else
            action=deploy
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Pull request #$PR_NUMBER is $state; preview action: $action."

      - name: Write preview helpers
        if: steps.state.outputs.action != 'superseded'
        run: |
          cat > "$RUNNER_TEMP/admin-preview.sh" <<'EOF'
          # Shared by the steps below. Removal is idempotent: absent resources are not an error.
          service_exists() {
            local found
            found=$(gcloud run services list --project "$PROJECT_ID" --region "$REGION" \
              --filter="metadata.name=$SERVICE" --format='value(metadata.name)')
            [ -n "$found" ]
          }
          remove_preview() {
            local packages
            for _ in 1 2 3 4 5; do
              service_exists || break
              gcloud run services delete "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet && break
              sleep 20
            done
            if service_exists; then echo "::error::Could not remove $SERVICE."; return 1; fi
            packages=$(gcloud artifacts packages list --project "$PROJECT_ID" --location "$REGION" \
              --repository admin-preview --format='value(name)')
            if printf '%s\n' "$packages" | grep -q "/packages/pr-$PR_NUMBER\$"; then
              gcloud artifacts packages delete "pr-$PR_NUMBER" --project "$PROJECT_ID" --location "$REGION" \
                --repository admin-preview --quiet
            fi
          }
          # upsert_comment BODY [update-only]: keeps a single preview comment per PR.
          upsert_comment() {
            local ids id payload
            ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- admin-preview -->"))) | .id')
            id=${ids%%$'\n'*}
            payload=$(jq -n --arg body "$1" '{body: $body}')
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" --input - <<< "$payload" > /dev/null
            elif [ "${2:-}" != "update-only" ]; then
              gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" --input - <<< "$payload" > /dev/null
            fi
          }
          # is_iap_signin_redirect LOCATION: true only for IAP's redirect to Google sign-in, that is
          # accounts.google.com with redirect_uri https://iap.googleapis.com/v1/oauth/clientIds/<id>:handleRedirect
          # (directly or inside a nested continue= URL that is also on accounts.google.com).
          is_iap_signin_redirect() {
            python3 -I - "$1" <<'PY'
          import re
          import sys
          from urllib.parse import parse_qs, urlsplit

          IAP_REDIRECT = re.compile(r"https://iap\.googleapis\.com/v1/oauth/clientIds/[A-Za-z0-9._-]+:handleRedirect")

          def is_signin(url, depth=0):
              parts = urlsplit(url)
              if parts.scheme != "https" or parts.hostname != "accounts.google.com":
                  return False
              query = parse_qs(parts.query)
              if any(IAP_REDIRECT.fullmatch(value) for value in query.get("redirect_uri", [])):
                  return True
              return depth < 2 and any(is_signin(value, depth + 1) for value in query.get("continue", []))

          sys.exit(0 if is_signin(sys.argv[1]) else 1)
          PY
          }
          EOF

      - name: Download image
        if: steps.state.outputs.action == 'deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-image-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/admin-image

      - name: Authenticate to Google Cloud
        if: steps.state.outputs.action != 'superseded'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.ADMIN_PREVIEW_WIF_PROVIDER }}
          service_account: ${{ vars.ADMIN_PREVIEW_DEPLOYER_SA }}
          project_id: ${{ vars.ADMIN_PREVIEW_PROJECT_ID }}

      - name: Setup gcloud
        if: steps.state.outputs.action != 'superseded'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Remove preview of a closed pull request
        if: steps.state.outputs.action == 'remove'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/admin-preview.sh"
          remove_preview

      - name: Push image
        id: image
        if: steps.state.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/admin-image/admin-image.tar"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker tag "admin-preview:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(gcloud artifacts docker images describe "$IMAGE:$GITHUB_SHA" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Could not resolve the pushed image digest."; exit 1; }
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        if: steps.state.outputs.action == 'deploy'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          ALLOWED_UID: ${{ secrets.ADMIN_PREVIEW_ALLOWED_UID }}
          FIREBASE_API_KEY: ${{ vars.ADMIN_PREVIEW_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.ADMIN_PREVIEW_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_APP_ID: ${{ vars.ADMIN_PREVIEW_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail
          umask 077
          env_file="$RUNNER_TEMP/admin-preview-env.json"
          trap 'rm -f "$env_file"' EXIT
          # Runtime configuration only: the image itself carries none. No credentials are passed;
          # the Admin SDK uses the runtime service account through the metadata server.
          jq -n \
            --arg origin "$PREVIEW_URL" --arg uid "$ALLOWED_UID" --arg project "$PROJECT_ID" \
            --arg apiKey "$FIREBASE_API_KEY" --arg authDomain "$FIREBASE_AUTH_DOMAIN" --arg appId "$FIREBASE_APP_ID" \
            '{
              ADMIN_ENV: "development",
              ADMIN_ORIGIN: $origin,
              ADMIN_ALLOWED_UID: $uid,
              FIREBASE_PROJECT_ID: $project,
              NEXT_PUBLIC_FIREBASE_API_KEY: $apiKey,
              NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: $authDomain,
              NEXT_PUBLIC_FIREBASE_PROJECT_ID: $project,
              NEXT_PUBLIC_FIREBASE_APP_ID: $appId,
              NEXT_PUBLIC_FIREBASE_USE_EMULATORS: "false"
            }' > "$env_file"
          # No --[no-]allow-unauthenticated: new services require authentication by default and the
          # deployer has no permission to change service IAM policies.
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE_REF" \
            --service-account "$RUNTIME_SA" \
            --iap --ingress all \
            --min-instances 0 --max-instances 1 \
            --cpu 1 --memory 512Mi --cpu-boost --timeout 60 \
            --env-vars-file "$env_file" \
            --labels "managed-by=admin-preview,pr-number=$PR_NUMBER,commit=${RUN_HEAD_SHA:0:12}" \
            --quiet

      - name: Verify deployment and access protection
        if: steps.state.outputs.action == 'deploy'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/admin-preview.sh"
          reject() { echo "::error::$1 Removing the preview."; remove_preview; exit 1; }
          token=$(gcloud auth print-access-token)
          # The service resource includes environment values, so it is checked and never printed.
          service=$(curl -sS --fail -H "Authorization: Bearer $token" \
            "https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION/services/$SERVICE")
          check() { jq -e --arg url "$PREVIEW_URL" --arg image "$IMAGE_REF" --arg sa "$RUNTIME_SA" "$1" <<< "$service" > /dev/null; }
          check '.terminalCondition.state == "CONDITION_SUCCEEDED"' || { echo "::error::The service is not ready."; exit 1; }
          check '.iapEnabled == true' || reject "IAP is not enabled."
          check '(.invokerIamDisabled // false) == false' || reject "The invoker IAM check is disabled."
          # shellcheck disable=SC2016 # $image, $sa and $url are jq variables.
          {
            check '.template.containers[0].image == $image' || { echo "::error::The service does not run the pushed image."; exit 1; }
            check '.template.serviceAccount == $sa' || reject "Unexpected runtime service account."
            check '(.urls // []) | index($url) != null' || { echo "::error::$PREVIEW_URL is not among the service URLs."; exit 1; }
          }
          gcloud run services get-iam-policy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -e '[.bindings[]?.members[]?] | any(. == "allUsers" or . == "allAuthenticatedUsers") | not' > /dev/null \
            || reject "The service grants public access."
          # An anonymous request must be stopped by IAP itself. The application can also answer with
          # 302/307 or 401/403, so a status code alone proves nothing: IAP marks every response it
          # generates with X-Goog-IAP-Generated-Response, and its 302 leads to Google sign-in with
          # IAP's own redirect URI. Anything that is not attributable to IAP removes the preview.
          headers="$RUNNER_TEMP/anonymous-response-headers"
          verdict="no response"
          for _ in $(seq 1 12); do
            : > "$headers"
            code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-time 20 "$PREVIEW_URL/admin/entrar" || true)
            iap=no
            if grep -qi '^x-goog-iap-generated-response:' "$headers"; then iap=yes; fi
            location=$(sed -n 's/^location:[[:space:]]*//Ip' "$headers" | tr -d '\r')
            location_host=${location#*://}
            location_host=${location_host%%[/?#]*}
            # Only the status, the IAP marker and the redirect host are logged (logs are public).
            verdict="HTTP $code, IAP header: $iap, redirect host: ${location_host:-none}"
            case "$code" in
              302)
                if [ "$iap" = yes ] && is_iap_signin_redirect "$location"; then
                  echo "Anonymous access is redirected to Google sign-in by IAP."
                  exit 0
                fi
                reject "An anonymous request was redirected, but not to IAP's Google sign-in ($verdict)." ;;
              401|403)
                if [ "$iap" = yes ]; then
                  echo "Anonymous access is denied by IAP (HTTP $code)."
                  exit 0
                fi
                reject "An anonymous request was refused, but not by IAP ($verdict)." ;;
              000|404|429|5??) sleep 5 ;;
              *) reject "The preview answered an anonymous request ($verdict)." ;;
            esac
          done
          reject "Could not confirm that IAP blocks anonymous access (last: $verdict)."

      - name: Re-check pull request state
        id: final
        if: steps.state.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/admin-preview.sh"
          state=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state')
          if [ "$state" = "open" ]; then
            echo "outcome=deployed" >> "$GITHUB_OUTPUT"
          else
            # Closed while deploying: do not leave the service behind.
            remove_preview
            echo "outcome=removed" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pull request comment
        if: steps.state.outputs.action == 'remove' || steps.final.outputs.outcome != ''
        env:
          OUTCOME: ${{ steps.final.outputs.outcome || 'removed' }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/admin-preview.sh"
          short=${RUN_HEAD_SHA:0:7}
          if [ "$OUTCOME" = "deployed" ]; then
            body=$(cat <<EOF
          <!-- admin-preview -->
          ### Preview do admin

          **Endereço:** $PREVIEW_URL/admin/entrar
          **Commit:** \`$short\` · publicado em $(date -u '+%Y-%m-%d %H:%M') UTC

          - Ambiente de **desenvolvimento** (\`$PROJECT_ID\`), somente com dados fictícios.
          - Entre primeiro com uma conta Google autorizada (IAP) e depois com o usuário de teste do admin.
          - No celular, abra o link no Chrome ou no Safari.
          - O preview é removido automaticamente quando este PR for fechado ou integrado.
          EOF
            )
          else
            body=$(cat <<EOF
          <!-- admin-preview -->
          ### Preview do admin

          Preview removido: o PR não está mais aberto.
          EOF
            )
          fi
          if [ "$OUTCOME" = "deployed" ]; then upsert_comment "$body"; else upsert_comment "$body" update-only; fi

  # Reports failures on the PR. Runs without cloud credentials and only for the current head.
  preview-report:
    needs: [check, preview-image, preview-deploy]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.ADMIN_PREVIEW_ENABLED == 'true'
      && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # read the PR state and update the preview comment
    concurrency:
      group: admin-preview-report-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CHECK_RESULT: ${{ needs.check.result }}
      IMAGE_RESULT: ${{ needs.preview-image.result }}
      DEPLOY_RESULT: ${{ needs.preview-deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Report failure on the pull request
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
          if [ "$pr" != "open $RUN_HEAD_SHA" ]; then
            echo "This run is no longer current; nothing to report."
            exit 0
          fi
          if [ "$CHECK_RESULT" = "failure" ]; then stage="testes e build (check)"
          elif [ "$IMAGE_RESULT" = "failure" ]; then stage="imagem (preview-image)"
          else stage="publicação (preview-deploy)"; fi
          body=$(cat <<EOF
          <!-- admin-preview -->
          ### Preview do admin

          A publicação do commit \`${RUN_HEAD_SHA:0:7}\` falhou na etapa **$stage**. [Ver execução]($RUN_URL)

          Se havia um preview de um commit anterior, ele continua no mesmo endereço.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- admin-preview -->"))) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" --input - <<< "$payload" > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" --input - <<< "$payload" > /dev/null
          fi
