name: Admin CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/admin-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/admin-ci.yml'

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test appointments core
        run: npm run test:appointments --workspace @ana-psi/admin

      - name: Typecheck admin
        run: npm run typecheck:admin

      - name: Lint admin
        run: npm run lint:admin

      - name: Build admin
        run: npm run build:admin
